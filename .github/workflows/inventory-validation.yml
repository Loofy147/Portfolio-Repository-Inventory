name: Inventory Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt

      - name: Validate inventory schemas and cross-references
        run: python scripts/validate_inventory.py
